name: droidsphere
arch: ${GOARCH}
platform: linux
version: "0.1.0"
section: utils
priority: optional
maintainer: "DroidSphere contributors"
description: "Cross-platform Android device manager powered by ADB, Fastboot and scrcpy"
vendor: "DroidSphere contributors"
homepage: "https://github.com/mrAibo/tvadb-hub"
license: "MIT"
provides:
  - droidsphere

contents:
  - src: "./bin/DroidSphere"
    dst: /usr/bin/DroidSphere
  - src: "./build/linux/DroidSphere.desktop"
    dst: /usr/share/applications/DroidSphere.desktop
  - src: "./build/appicon.png"
    dst: /usr/share/icons/hicolor/256x256/apps/DroidSphere.png

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
