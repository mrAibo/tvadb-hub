name: PR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tvadb-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - uses: oven-sh/setup-bun@v2
      - name: Validate project version consistency
        run: bash scripts/check-version-consistency.sh
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck
      - name: Frontend tests
        working-directory: frontend
        run: bun run test

  go-test:
    runs-on: ubuntu-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend for Go embed
        working-directory: frontend
        run: bun run build
      - name: Download Go dependencies
        run: go mod download
      - name: Run Go tests
        run: go test ./...

  windows-build:
    runs-on: windows-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            winget install --id NSIS.NSIS --exact --silent --accept-package-agreements --accept-source-agreements
          }
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            throw "NSIS installation completed but makensis.exe was not found at $nsisPath."
          }
          $env:Path = "$nsisPath;$env:Path"
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $nsisPath "makensis.exe") /VERSION
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build Windows executable and installer
        shell: pwsh
        run: wails3 package GOOS=windows
      - name: Rename Windows CI assets
        shell: bash
        run: bash scripts/rename-release-assets.sh windows
      - name: Upload Windows portable build and installer
        uses: actions/upload-artifact@v4
        with:
          name: tvadb-hub-windows-amd64
          path: |
            bin/TVADB-Hub-*-windows-amd64.exe
            bin/TVADB-Hub-*-windows-amd64-installer.exe
          if-no-files-found: error


  linux-build:
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build Linux desktop binary
        run: wails3 build GOOS=linux
      - name: Upload Linux smoke-build
        uses: actions/upload-artifact@v4
        with:
          name: tvadb-hub-linux-amd64-smoke
          path: bin/TVADB-Hub
          if-no-files-found: error

  macos-build:
    runs-on: macos-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Verify Xcode Command Line Tools
        run: xcode-select -p
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build macOS desktop binary
        run: wails3 build GOOS=darwin
      - name: Upload macOS smoke-build
        uses: actions/upload-artifact@v4
        with:
          name: tvadb-hub-macos-smoke
          path: bin/TVADB-Hub
          if-no-files-found: error
