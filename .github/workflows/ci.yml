name: PR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: droidsphere-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Validate pinned toolchain
        run: bun scripts/check-toolchain.ts
      - name: Validate project version consistency
        run: bash scripts/check-version-consistency.sh
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck
      - name: Frontend tests
        working-directory: frontend
        run: bun run test

  go-test:
    runs-on: ubuntu-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend for Go embed
        working-directory: frontend
        run: bun run build
      - name: Download Go dependencies
        run: go mod download
      - name: Run Go tests
        run: go test ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...
      - name: Run race detector on concurrent backend packages
        run: |
          go test -race             ./internal/core             ./internal/device             ./internal/file             ./internal/package_mgr             ./internal/shell             ./internal/scrcpy             ./internal/tuning             ./internal/app             ./internal/launcher
      - name: Repeat the scrcpy race suite to catch recording-helper readiness flakiness
        run: go test -race ./internal/scrcpy -count=20

  windows-internal-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Run internal Go tests on Windows
        run: go test ./internal/...
      - name: Run Windows atomic-write regression tests
        run: go test -v -count=1 -run 'TestAtomicConcurrentWritesDoNotShareTemporaryFiles|TestWriteFileAtomicCommitRefusalPreservesDestinationAndCleansTemp' ./internal/core

  windows-build:
    runs-on: windows-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.20
      - name: Install NSIS
        shell: pwsh
        run: ./scripts/setup-nsis.ps1
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build Windows executable and installer
        shell: pwsh
        run: wails3 package GOOS=windows
      - name: Rename Windows CI assets
        shell: bash
        run: bash scripts/rename-release-assets.sh windows
      - name: Record Windows build provenance
        shell: bash
        run: |
          VERSION="$(awk '/^VERSION :=/ {print $3; exit}' Makefile)"
          bun scripts/write-build-provenance.ts windows "bin/DroidSphere-$VERSION-windows-amd64.exe" "bin/DroidSphere-$VERSION-windows-amd64-installer.exe"
      - name: Upload Windows portable build and installer
        uses: actions/upload-artifact@v4
        with:
          name: droidsphere-windows-amd64
          path: |
            bin/DroidSphere-*-windows-amd64.exe
            bin/DroidSphere-*-windows-amd64-installer.exe
            bin/BUILD_PROVENANCE-windows.json
          if-no-files-found: error


  linux-build:
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.20
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build Linux desktop binary
        run: wails3 build GOOS=linux
      - name: Record Linux build provenance
        run: bun scripts/write-build-provenance.ts linux-smoke bin/DroidSphere
      - name: Upload Linux smoke-build
        uses: actions/upload-artifact@v4
        with:
          name: droidsphere-linux-amd64-smoke
          path: |
            bin/DroidSphere
            bin/BUILD_PROVENANCE-linux-smoke.json
          if-no-files-found: error

  macos-build:
    runs-on: macos-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Verify Xcode Command Line Tools
        run: xcode-select -p
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.20
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build macOS desktop binary
        run: wails3 build GOOS=darwin
      - name: Record macOS build provenance
        run: bun scripts/write-build-provenance.ts macos-smoke bin/DroidSphere
      - name: Upload macOS smoke-build
        uses: actions/upload-artifact@v4
        with:
          name: droidsphere-macos-smoke
          path: |
            bin/DroidSphere
            bin/BUILD_PROVENANCE-macos-smoke.json
          if-no-files-found: error
