name: PR CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tvadb-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck
      - name: Frontend tests
        working-directory: frontend
        run: bun run test

  go-test:
    runs-on: ubuntu-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend for Go embed
        working-directory: frontend
        run: bun run build
      - name: Download Go dependencies
        run: go mod download
      - name: Run Go tests
        run: go test ./...

  windows-build:
    runs-on: windows-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Build TVADB Hub for Windows
        shell: pwsh
        run: wails3 build GOOS=windows
      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: tvadb-hub-windows-amd64
          path: bin/TVADB-Hub.exe
          if-no-files-found: error
