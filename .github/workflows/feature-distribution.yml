name: Build feature distribution

on:
  push:
    branches:
      - feat/about-icon-distribution

permissions:
  contents: write

concurrency:
  group: tvadb-feature-distribution
  cancel-in-progress: true

jobs:
  windows-distribution:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[distribution]')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            winget install --id NSIS.NSIS --exact --silent --accept-package-agreements --accept-source-agreements
          }
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            throw "NSIS installation completed but makensis.exe was not found at $nsisPath."
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Verify frontend
        working-directory: frontend
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build

      - name: Run Go tests
        run: go test ./...

      - name: Build portable executable and installer
        shell: pwsh
        run: wails3 package GOOS=windows

      - name: Rename release assets
        shell: bash
        run: bash scripts/rename-release-assets.sh windows

      - name: Prepare distribution directory
        shell: pwsh
        run: |
          $versionLine = Select-String -Path Makefile -Pattern '^VERSION :=\s*(\d+\.\d+\.\d+)\s*$'
          if (-not $versionLine) { throw "Unable to resolve VERSION from Makefile." }
          $version = $versionLine.Matches[0].Groups[1].Value
          $portable = "bin\TVADB-Hub-$version-windows-amd64.exe"
          $installer = "bin\TVADB-Hub-$version-windows-amd64-installer.exe"
          foreach ($path in @($portable, $installer)) {
            if (-not (Test-Path $path)) { throw "Missing expected build artifact: $path" }
          }

          New-Item -ItemType Directory -Force -Path "distribution\windows" | Out-Null
          Copy-Item $portable "distribution\windows\"
          Copy-Item $installer "distribution\windows\"

          $lines = foreach ($path in @($portable, $installer)) {
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            "$hash *$(Split-Path -Leaf $path)"
          }
          $lines | Set-Content -Encoding ascii "distribution\windows\SHA256SUMS.txt"

      - name: Commit compiled distribution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f distribution/windows/*.exe distribution/windows/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Distribution is already up to date."
            exit 0
          fi
          git commit -m "chore(distribution): add Windows binaries [distribution]"
          git push origin HEAD:feat/about-icon-distribution
